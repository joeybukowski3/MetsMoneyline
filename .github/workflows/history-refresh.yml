name: Postgame History Refresh

on:
  schedule:
    - cron: "0 4,5,6,7 * * *"   # UTC 4-7 AM = ET midnight-3 AM
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-write
  cancel-in-progress: false

jobs:
  refresh-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check overnight ET window
        id: gate
        run: |
          ET_HOUR=$(TZ=America/New_York date +%-H)
          if [ "$ET_HOUR" -ge 0 ] && [ "$ET_HOUR" -le 3 ]; then
            echo "ET hour ${ET_HOUR} is in overnight window — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "ET hour ${ET_HOUR} is outside overnight window — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ./bot
        run: npm ci

      - name: Refresh pick history
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ./bot
        run: node refresh-pick-history.js

      - name: Commit and push updated history
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/pick-history.json
          if git diff --staged --quiet; then
            echo "No pick history changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh pick history [skip ci]"
          git pull --rebase origin main
          git push origin main
