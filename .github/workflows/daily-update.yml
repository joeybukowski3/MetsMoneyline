name: Daily Site Data Update

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-site-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - name: Fetch and archive Mets odds
        working-directory: ./bot
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_SPORTS_BASE_URL: ${{ secrets.API_SPORTS_BASE_URL }}
          API_SPORTS_MLB_LEAGUE_ID: ${{ secrets.API_SPORTS_MLB_LEAGUE_ID }}
          API_SPORTS_METS_TEAM_ID: ${{ secrets.API_SPORTS_METS_TEAM_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node build-api-cache.js

      - name: Generate next Mets game package
        run: node bot/generator.js

      - name: Refresh trends data
        run: node bot/build-trends.js
        env:
          NODE_ENV: production

      - name: Refresh prospects data
        run: node bot/build-prospects.js
        env:
          NODE_ENV: production

      - name: Build power rankings (season + L30)
        run: node bot/build-power-rankings.js

      - name: Commit and push updated site data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/api/mlb/mets/next-game \
                  public/api/mlb/mets/live-game \
                  public/api/mlb/mets/standings \
                  public/api/mlb/mets/recent-games \
                  public/api/mlb/mets/overview \
                  public/api/mlb/mets/odds.json \
                  public/data/sample-game.json \
                  public/data/odds-history.json \
                  public/data/trends.json \
                  public/data/prospects.json \
                  public/data/power-rankings.json \
                  public/data/power-rankings-l30.json \
                  public/report.html \
                  public/power-rankings.html
          if git diff --staged --quiet; then
            echo "No site data updates to commit."
            exit 0
          fi
          git commit -m "chore: refresh daily site data [skip ci]"
          git pull --rebase origin main
          git push origin main
