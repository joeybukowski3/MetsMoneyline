name: Daily Site Data Update

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-write
  cancel-in-progress: false

jobs:
  refresh-site-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      # Step 1: Refresh API cache (odds, next-game, standings, live-game)
      - name: Fetch and refresh API cache
        working-directory: ./bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_SPORTS_BASE_URL: ${{ secrets.API_SPORTS_BASE_URL }}
          API_SPORTS_MLB_LEAGUE_ID: ${{ secrets.API_SPORTS_MLB_LEAGUE_ID }}
          API_SPORTS_METS_TEAM_ID: ${{ secrets.API_SPORTS_METS_TEAM_ID }}
        run: node build-api-cache.js

      # Step 2: Generate game package, report.html, sitemap.xml, rss.xml
      - name: Generate next Mets game package
        working-directory: ./bot
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ secrets.GROK_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_SPORTS_BASE_URL: ${{ secrets.API_SPORTS_BASE_URL }}
          API_SPORTS_MLB_LEAGUE_ID: ${{ secrets.API_SPORTS_MLB_LEAGUE_ID }}
          API_SPORTS_METS_TEAM_ID: ${{ secrets.API_SPORTS_METS_TEAM_ID }}
        run: node generator.js

      # Step 3: Refresh trends data
      - name: Refresh trends data
        working-directory: ./bot
        env:
          NODE_ENV: production
        run: node build-trends.js

      # Step 4: Refresh prospects data
      - name: Refresh prospects data
        working-directory: ./bot
        env:
          NODE_ENV: production
        run: node build-prospects.js

      # Step 5: Build power rankings (season + L30)
      - name: Smoke test power rankings logic
        working-directory: ./bot
        run: node test-power-rankings.js

      - name: Build power rankings (season + L30)
        working-directory: ./bot
        continue-on-error: true
        run: node build-power-rankings.js

      # Step 6: Commit everything the above scripts wrote
      - name: Commit and push updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage ALL files the scripts may have written
          git add \
            public/api/mlb/mets/next-game \
            public/api/mlb/mets/live-game \
            public/api/mlb/mets/standings \
            public/api/mlb/mets/recent-games \
            public/api/mlb/mets/overview \
            public/api/mlb/mets/odds.json \
            public/data/sample-game.json \
            public/data/odds-history.json \
            public/data/trends.json \
            public/data/prospects.json \
            public/data/power-rankings.json \
            public/report.html \
            public/power-rankings.html \
            public/sitemap.xml \
            public/rss.xml \
            || true

          # Also stage any other files modified by the scripts
          # (bot/output/, bot/report-send-state.json, etc.)
          # to prevent "unstaged changes" blocking the rebase
          git add -A || true

          if git diff --staged --quiet; then
            echo "No site data updates to commit."
            exit 0
          fi

          git commit -m "chore: refresh daily site data [skip ci]"

          # Pull any concurrent pushes before we push
          git pull --rebase origin main

          git push origin main
