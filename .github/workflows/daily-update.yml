name: Daily Odds Update

on:
  schedule:
    - cron: "0 14,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - name: Fetch and archive Mets odds
        working-directory: ./bot
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_SPORTS_BASE_URL: ${{ secrets.API_SPORTS_BASE_URL }}
          API_SPORTS_MLB_LEAGUE_ID: ${{ secrets.API_SPORTS_MLB_LEAGUE_ID }}
          API_SPORTS_METS_TEAM_ID: ${{ secrets.API_SPORTS_METS_TEAM_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node build-api-cache.js

      - name: Commit and push updated odds artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/odds-history.json public/api/mlb/mets
          if git diff --staged --quiet; then
            echo "No odds updates to commit."
            exit 0
          fi
          git commit -m "chore: refresh Mets odds artifacts [skip ci]"
          git pull --rebase origin main
          git push origin main
