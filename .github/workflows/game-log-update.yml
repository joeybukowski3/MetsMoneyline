name: Game Log Daily Update

on:
  schedule:
    # 7:00 AM UTC = 3:00 AM ET (EDT). Runs after all overnight games are final.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - name: Build game log
        run: node bot/build-game-log.js
        env:
          NODE_ENV: production

      - name: Commit and push game log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/game-log.json
          if git diff --staged --quiet; then
            echo "Game log unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh game log data [skip ci]"
          git pull --rebase origin main
          git push origin main
