name: Game Log Update

on:
  schedule:
    - cron: "15 9 * * *"   # 5:15 AM ET daily (after games finish)
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

jobs:
  update-game-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - name: Build game log
        working-directory: ./bot
        run: node build-game-log.js

      - name: Commit and push game-log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/game-log.json
          if git diff --staged --quiet; then
            echo "No game log changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh game-log.json [skip ci]"
          git pull --rebase origin main
          git push origin main
