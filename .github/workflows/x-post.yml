name: X Post

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Post type"
        required: true
        default: "pregame"
        type: choice
        options:
          - pregame
          - postgame
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - post
      date:
        description: "Optional target date: blank, yesterday, or YYYY-MM-DD"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  x-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - name: Resolve X post parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "type=postgame" >> "$GITHUB_OUTPUT"
            echo "mode=post" >> "$GITHUB_OUTPUT"
            echo "date=" >> "$GITHUB_OUTPUT"
          else
            echo "type=${{ inputs.type }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run X post bot
        working-directory: ./bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        shell: bash
        run: |
          DATE_ARG=""
          if [ -n "${{ steps.params.outputs.date }}" ]; then
            DATE_ARG=" --date=${{ steps.params.outputs.date }}"
          fi
          node x-post-mets-report.js --${{ steps.params.outputs.mode }} --type=${{ steps.params.outputs.type }}$DATE_ARG

      - name: Commit X post state
        if: steps.params.outputs.mode == 'post'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/x-post-state.json
          if git diff --cached --quiet; then
            echo "No X post state changes to commit."
            exit 0
          fi
          git commit -m "chore: record X post state [skip ci]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git push origin main
