name: X Post

on:
  schedule:
    # Pregame: 10 AM–1 PM ET (14:00–17:00 UTC) — after morning data refresh
    # Postgame: 7 PM–2 AM ET (23:00–06:00 UTC) — within ~1hr of game end
    - cron: "0 14,15,16,17,23,0,1,2,3,4,5,6 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Post type"
        required: true
        default: "pregame"
        type: choice
        options:
          - pregame
          - postgame
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - post
      date:
        description: "Optional target date: blank, today, yesterday, or YYYY-MM-DD"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  x-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - - name: Resolve X post parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=post" >> "$GITHUB_OUTPUT"
            ET_HOUR=$(TZ=America/New_York date +%-H)
            if [ "$ET_HOUR" -ge 10 ] && [ "$ET_HOUR" -lt 14 ]; then
              echo "type=pregame" >> "$GITHUB_OUTPUT"
              echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
            else
              echo "type=postgame" >> "$GITHUB_OUTPUT"
              if [ "$ET_HOUR" -ge 4 ]; then
                echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
              else
                echo "date=$(TZ=America/New_York date -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "type=${{ inputs.type }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh pick history (fetch latest game result)
        if: steps.params.outputs.mode == 'post'
        working-directory: ./bot
        run: node refresh-pick-history.js

      - name: Run X post bot
        working-directory: ./bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        shell: bash
        run: |
          DATE_ARG=""
          if [ -n "${{ steps.params.outputs.date }}" ]; then
            DATE_ARG=" --date=${{ steps.params.outputs.date }}"
          fi
          node x-post-mets-report.js --${{ steps.params.outputs.mode }} --type=${{ steps.params.outputs.type }}$DATE_ARG

      - name: Commit X post state and refreshed history
        if: steps.params.outputs.mode == 'post'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/x-post-state.json public/data/pick-history.json
          if git diff --cached --quiet; then
            echo "No X post state changes to commit."
            exit 0
          fi
          git commit -m "chore: record X post state [skip ci]"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git push origin main
