name: Depth Chart Update

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 3 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-write
  cancel-in-progress: false

jobs:
  rebuild-depth-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebase on latest main
        run: git pull --rebase origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      - name: Rebuild depth chart data
        working-directory: ./bot
        run: node update-depth-chart.js

      - name: Regenerate sitemap
        working-directory: ./bot
        run: node generate-sitemap.js

      - name: Commit refreshed depth chart artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/depth-chart.json public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No depth chart changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh depth chart artifacts [skip ci]"
          git pull --rebase origin main
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
