name: Send Daily Report

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent concurrent runs that both write pick-history.json / report data
concurrency:
  group: site-data-write
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        working-directory: ./bot
        run: npm ci

      # Refresh live odds, next-game, standings, and live-game API cache
      - name: Refresh API cache
        working-directory: ./bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_SPORTS_BASE_URL: ${{ secrets.API_SPORTS_BASE_URL }}
          API_SPORTS_MLB_LEAGUE_ID: ${{ secrets.API_SPORTS_MLB_LEAGUE_ID }}
          API_SPORTS_METS_TEAM_ID: ${{ secrets.API_SPORTS_METS_TEAM_ID }}
        run: node build-api-cache.js

      # Check eligibility window and send if conditions are met
      - name: Check eligibility and send report
        id: sendcheck
        continue-on-error: true
        working-directory: ./bot
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_SPORTS_BASE_URL: ${{ secrets.API_SPORTS_BASE_URL }}
          API_SPORTS_MLB_LEAGUE_ID: ${{ secrets.API_SPORTS_MLB_LEAGUE_ID }}
          API_SPORTS_METS_TEAM_ID: ${{ secrets.API_SPORTS_METS_TEAM_ID }}
        run: node check-and-send-report.js

      # Always commit any changed data files back to the repo
      - name: Commit updated report data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage everything that the two scripts above may have written
          git add --ignore-errors \
            bot/report-send-state.json \
            public/data/sample-game.json \
            public/report.html \
            public/sitemap.xml \
            public/rss.xml \
            "public/api/mlb/mets/" \
            "public/data/odds-history.json" \
            || true

          if git diff --staged --quiet; then
            echo "Nothing changed — no commit needed."
            exit 0
          fi

          git commit -m "chore: report send state update [skip ci]"
          git pull --rebase origin main
          git push origin main

      # Bubble up any failure from the send step
      - name: Fail if send step errored
        if: steps.sendcheck.outcome == 'failure'
        run: |
          echo "Report send step failed. Check the 'Check eligibility and send report' step logs above."
          exit 1
