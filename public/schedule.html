  <style>
    .sch-shell { max-width: 1100px; margin: 0 auto; padding: 0 1rem 3rem; }

    /* ── HERO ── */
    .sch-hero {
      background: linear-gradient(135deg, #002d72 0%, #003fa8 100%);
      border-radius: 14px;
      padding: 1.4rem 1.5rem 1.3rem;
      margin: 1rem 0 1.1rem;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .sch-hero::before {
      content: "";
      position: absolute;
      top: -50px; right: -50px;
      width: 200px; height: 200px;
      background: rgba(255,89,16,0.07);
      border-radius: 50%;
      pointer-events: none;
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
    }
    .hero-top h1 {
      font-family: "Oswald", sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
      color: #fff;
    }
    .hero-record {
      font-size: 0.88rem;
      font-weight: 800;
      background: #ff5910;
      color: #fff;
      padding: 0.2rem 0.65rem;
      border-radius: 6px;
    }
    .hero-meta { font-size: 0.62rem; color: rgba(255,255,255,0.4); margin-left: auto; }

    /* SOS comparison: played | divider | upcoming */
    .sos-compare {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 0 1.25rem;
      align-items: start;
    }
    .sos-divider-v {
      background: rgba(255,255,255,0.12);
      height: 100%;
      min-height: 70px;
    }
    .sos-panel-title {
      font-size: 0.58rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.65rem;
    }
    .sos-panel.played .sos-panel-title  { color: rgba(255,255,255,0.5); }
    .sos-panel.upcoming .sos-panel-title { color: rgba(255,89,16,0.9); }

    /* Rank badge */
    .sos-rank-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.65rem;
    }
    .sos-rank-badge {
      font-family: "Oswald", sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }
    .sos-rank-label {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.45);
      line-height: 1.3;
    }
    .sos-rank-badge.rank-easy   { color: #4ade80; }
    .sos-rank-badge.rank-mid    { color: #fbbf24; }
    .sos-rank-badge.rank-hard   { color: #f87171; }

    /* Stat row */
    .sos-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem 1rem;
    }
    .sos-stat {
      min-width: 0;
    }
    .sos-stat-val {
      font-family: "Oswald", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }
    .sos-stat-lbl {
      font-size: 0.53rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.4);
      margin-top: 0.1rem;
    }
    .sos-delta {
      font-size: 0.6rem;
      font-weight: 700;
      margin-left: 2px;
      vertical-align: middle;
    }
    .sos-delta.harder { color: #f87171; }
    .sos-delta.easier { color: #4ade80; }

    /* ── MOBILE TABS ── */
    .sch-tabs {
      display: none; /* hidden on desktop */
      gap: 0;
      margin-bottom: 0;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
      border: 1px solid #d9e1ee;
      border-bottom: none;
    }
    .sch-tab {
      flex: 1;
      padding: 0.6rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: center;
      cursor: pointer;
      background: #f0f4f9;
      color: #64748b;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .sch-tab.active.played   { background: #002d72; color: #fff; }
    .sch-tab.active.upcoming { background: #ff5910; color: #fff; }

    /* ── TABLE LAYOUT ── */
    .sch-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      align-items: start;
    }
    .sch-col { }
    .sch-col-head {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.42rem 0.7rem;
      border-radius: 8px 8px 0 0;
      font-size: 0.62rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    .sch-col-head.played   { background: #002d72; color: #fff; }
    .sch-col-head.upcoming { background: #ff5910; color: #fff; }
    .col-count {
      margin-left: auto;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 0.07rem 0.38rem;
      font-size: 0.57rem;
    }

    .sch-table-wrap {
      border: 1px solid #d9e1ee;
      border-top: none;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
      background: #fff;
    }
    .sch-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.69rem;
    }
    .sch-table thead {
      position: static;
    }
    .sch-table thead th {
      padding: 0.32rem 0.5rem;
      background: #f0f4f9;
      color: #64748b;
      font-size: 0.56rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      border-bottom: 1px solid #d9e1ee;
      white-space: nowrap;
    }
    .sch-table thead th.c { text-align: center; }
    .sch-table tbody tr.game-row {
      border-bottom: 1px solid #f0f4f9;
      cursor: pointer;
      transition: background 0.1s;
    }
    .sch-table tbody tr.game-row:hover  { background: #f8fafd; }
    .sch-table tbody tr.series-end { border-bottom: 2px solid #d9e1ee; }
    .sch-table tbody tr.today-row  { background: rgba(255,89,16,0.04); }
    .sch-table td {
      padding: 0.32rem 0.5rem;
      color: #1e293b;
      vertical-align: middle;
      white-space: nowrap;
    }
    .sch-table td.c { text-align: center; }

    /* Chevron */
    .sch-chev { font-size: 0.55rem; color: #94a3b8; transition: transform 0.18s; display: inline-block; margin-left: 2px; }
    .game-row.open .sch-chev { transform: rotate(90deg); }

    /* Result badge */
    .res-badge {
      display: inline-block;
      width: 1.2rem; height: 1.2rem; line-height: 1.2rem;
      text-align: center; border-radius: 3px;
      font-size: 0.6rem; font-weight: 900;
    }
    .res-badge.W { background: rgba(21,128,61,0.12); color: #15803d; }
    .res-badge.L { background: rgba(185,28,28,0.1);  color: #b91c1c; }

    .ha-badge     { font-size: 0.56rem; font-weight: 700; color: #94a3b8; }
    .ha-badge.home{ color: #002d72; }
    .opp-cell     { font-weight: 700; color: #002d72; }
    .opp-logo     { width: 13px; height: 13px; vertical-align: middle; margin-right: 3px; object-fit: contain; }
    .rec-cell     { font-size: 0.62rem; font-weight: 700; color: #475569; }
    .today-badge  { font-size: 0.52rem; font-weight: 800; color: #ff5910; background: rgba(255,89,16,0.1); border-radius: 3px; padding: 0.05rem 0.25rem; margin-left: 3px; }

    /* ── Detail drawer ── */
    .detail-row { display: none; }
    .detail-row.open { display: table-row; }
    .detail-cell {
      padding: 0 0.5rem 0.5rem !important;
      background: #f8fafd;
      border-bottom: 2px solid #e2e8f0;
    }
    .detail-inner {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.45rem 0.6rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
    }
    .d-stat { text-align: center; min-width: 38px; }
    .d-val  { font-size: 0.8rem; font-weight: 800; line-height: 1.1; color: #002d72; }
    .d-val.era-good  { color: #15803d; }
    .d-val.era-mid   { color: #b45309; }
    .d-val.era-bad   { color: #b91c1c; }
    .d-val.wp-high   { color: #15803d; }
    .d-val.wp-mid    { color: #b45309; }
    .d-val.wp-low    { color: #b91c1c; }
    .d-val.win-score { color: #15803d; }
    .d-val.loss-score{ color: #b91c1c; }
    .d-lbl  { font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-top: 0.08rem; }
    .d-div  { width: 1px; background: #e2e8f0; align-self: stretch; }

    .sch-loading { padding: 2rem; text-align: center; color: #94a3b8; font-size: 0.8rem; }
    .sch-error   { padding: 1rem; text-align: center; color: #b91c1c; font-size: 0.76rem; background: rgba(185,28,28,0.05); border-radius: 8px; }

    /* ── MOBILE (≤650px): tabs replace side-by-side ── */
    @media (max-width: 650px) {
      .sch-hero    { padding: 1rem 1rem 1rem; }
      .sos-compare { grid-template-columns: 1fr; gap: 0.85rem 0; }
      .sos-divider-v { display: none; }
      .sos-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem 0.85rem; }

      .sch-tabs { display: flex; }
      .sch-cols { grid-template-columns: 1fr; gap: 0; }

      /* On mobile hide the col-head (tabs replace it) and connect to tab bar */
      .sch-col-head { border-radius: 0; }
      .sch-col      { display: none; }
      .sch-col.tab-active { display: block; }

      /* Remove top border-radius on table wrap when below tabs */
      .sch-col.tab-active .sch-col-head { border-radius: 0; }
      .sch-col.tab-active .sch-table-wrap { border-radius: 0 0 10px 10px; max-height: 60vh; overflow-y: auto; }
      .sch-table thead { position: sticky; top: 0; z-index: 2; }

      .sch-table { font-size: 0.63rem; }
      .sch-table td, .sch-table thead th { padding: 0.28rem 0.35rem; }
      .hero-top h1 { font-size: 1.2rem; }
      .sos-stat-val { font-size: 1rem; }
      .sos-rank-badge { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <header></header>

  <main>
  <div class="sch-shell">

    <!-- HERO -->
    <div class="sch-hero" id="sch-hero" style="display:none">
      <div class="hero-top">
        <h1>2026 Mets Schedule</h1>
        <span class="hero-record" id="hero-record">—</span>
        <span class="hero-meta" id="hero-meta"></span>
      </div>
      <div class="sos-compare">
        <div class="sos-panel played" id="sos-played-panel">
          <div class="sos-panel-title">⚔ Opponents Faced</div>
          <div class="sos-rank-row" id="sos-played-rank"></div>
          <div class="sos-stats"   id="sos-played-stats"></div>
        </div>
        <div class="sos-divider-v"></div>
        <div class="sos-panel upcoming" id="sos-upcoming-panel">
          <div class="sos-panel-title">📅 Opponents Remaining</div>
          <div class="sos-rank-row" id="sos-upcoming-rank"></div>

    <!-- Mobile tabs -->
    <div class="sch-tabs" id="sch-tabs">
      <button class="sch-tab played active"   onclick="switchTab('played')">✓ Played</button>

    <!-- Tables -->
    <div class="sch-cols" id="sch-cols">
      <div class="sch-col tab-active" id="col-played">
        <div class="sch-col-head played">
          ✓ Games Played <span class="col-count" id="played-count">—</span>
        </div>
        <div class="sch-table-wrap" id="played-wrap">
          <div class="sch-loading">Loading…</div>
        </div>
      </div>
      <div class="sch-col" id="col-upcoming">
        <div class="sch-col-head upcoming">
          📅 Upcoming <span class="col-count" id="upcoming-count">—</span>

  </div>

  <footer></footer>
  <script defer src="/js/site-header.js"></script>
  <script defer src="/js/site-footer.js"></script>
  <script>
  /* ── Tab switching (mobile) ── */
  function switchTab(which) {
    const tabs = document.querySelectorAll(".sch-tab");
    const cols = { played: document.getElementById("col-played"), upcoming: document.getElementById("col-upcoming") };
    tabs.forEach(t => t.classList.remove("active"));
    document.querySelector(`.sch-tab.${which}`).classList.add("active");
    Object.entries(cols).forEach(([k, el]) => el.classList.toggle("tab-active", k === which));
  }

  /* ── Toggle detail drawer ── */
  function toggleDetail(id) {
    const row    = document.querySelector(`[data-id="${id}"]`);
    const detail = document.getElementById(`${id}-d`);
    if (!detail) return;
    const open = detail.classList.toggle("open");
    row.classList.toggle("open", open);
  }

  (async () => {
    const logo    = id => `<img src="https://www.mlbstatic.com/team-logos/${id}.svg" class="opp-logo" alt="" onerror="this.style.display='none'">`;
    const fmtDate = d  => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });
    const fmtEra  = e  => { const n = parseFloat(e); return isNaN(n) ? "—" : n.toFixed(2); };
    const fmtAvg  = a  => { if (!a) return "—"; const n = parseFloat(String(a).replace(/^\./, "0.")); return isNaN(n) ? "—" : "." + Math.round(n*1000).toString().padStart(3,"0"); };
    const fmtWpct = p  => p == null ? "—" : (p * 100).toFixed(1) + "%";
    const eraClass  = e => { const n = parseFloat(e); if (isNaN(n)) return ""; return n < 3.5 ? "era-good" : n < 4.5 ? "era-mid" : "era-bad"; };
    const wpClass   = p => p == null ? "" : p >= 0.55 ? "wp-high" : p >= 0.45 ? "wp-mid" : "wp-low";
    const rankClass = r => r == null ? "" : r <= 10 ? "rank-hard" : r <= 20 ? "rank-mid" : "rank-easy";
    const rankLabel = r => r == null ? "" : r <= 10 ? "Tough schedule" : r <= 20 ? "Mid-range schedule" : "Soft schedule";
    const suffix    = n => n == null ? "—" : n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th");
    const parseAvgValue = value => {
      if (value == null || value === "") return null;
      const n = parseFloat(String(value).replace(/^\./, "0."));
      return isNaN(n) ? null : n;
    };
    const parseNumeric = value => {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    };
    const average = (rows, getter) => {
      const values = rows.map(getter).filter(value => value != null);
      if (!values.length) return null;
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    };
    const buildCombinedRecord = rows => {
      const validRows = rows.filter(g => parseNumeric(g.oppWins) != null && parseNumeric(g.oppLosses) != null);
      if (!validRows.length) return null;
      const wins = validRows.reduce((sum, g) => sum + parseNumeric(g.oppWins), 0);
      const losses = validRows.reduce((sum, g) => sum + parseNumeric(g.oppLosses), 0);
      if (!wins && !losses) return null;
      return {
        wins,
        losses,
        winPct: wins + losses > 0 ? wins / (wins + losses) : null
      };
    };
    const buildSectionSummary = rows => ({
      avgOppWinPct: average(rows, g => parseNumeric(g.oppWinPct)),
      avgOppEra: average(rows, g => parseNumeric(g.oppSeasonEra)),
      avgOppAvg: average(rows, g => parseAvgValue(g.oppSeasonAvg)),
      combinedRecord: buildCombinedRecord(rows)
    });
    const fmtRecord = record => record ? `${record.wins}-${record.losses}` : "—";

    function detailHtml(g, isPlayed, colspan) {
      const parts = [];
      if (isPlayed && g.finalScore) {
        parts.push(`<div class="d-stat"><div class="d-val ${g.result==="W"?"win-score":"loss-score"}">${g.finalScore}</div><div class="d-lbl">Score</div></div><div class="d-div"></div>`);
      }
      if (g.oppWinPct != null) parts.push(`<div class="d-stat"><div class="d-val ${wpClass(g.oppWinPct)}">${fmtWpct(g.oppWinPct)}</div><div class="d-lbl">Opp W%</div></div>`);
      if (g.oppSeasonEra)       parts.push(`<div class="d-stat"><div class="d-val ${eraClass(g.oppSeasonEra)}">${fmtEra(g.oppSeasonEra)}</div><div class="d-lbl">Opp ERA</div></div>`);
      if (g.oppSeasonAvg)       parts.push(`<div class="d-stat"><div class="d-val">${fmtAvg(g.oppSeasonAvg)}</div><div class="d-lbl">Opp AVG</div></div>`);
      if (!isPlayed && g.seriesGameNum) parts.push(`<div class="d-stat"><div class="d-val" style="color:#64748b">G${g.seriesGameNum}/${g.seriesLength||"?"}</div><div class="d-lbl">Series</div></div>`);
      if (!parts.length) return "";
      return `<tr class="detail-row" id="ROWID-d"><td class="detail-cell" colspan="${colspan}"><div class="detail-inner">${parts.join("")}</div></td></tr>`;
    }

    function buildTable(rows, isPlayed) {
      const hdr = isPlayed
        ? `<th>Date</th><th>H·A</th><th>Opponent</th><th class="c">Mets Rec</th><th class="c">Result</th>`
        : `<th>Date</th><th>H·A</th><th>Opponent</th><th class="c">Opp Record</th>`;
      const colspan = isPlayed ? 5 : 4;
      const tbody = rows.map((g, i) => {
        const id  = `gr-${isPlayed ? "p" : "u"}-${i}`;
        const ha  = g.homeAway === "home";
        const serCls   = g.isSeriesLast ? " series-end" : "";
        const todayCls = g._today ? " today-row" : "";
        const todayBadge = g._today ? `<span class="today-badge">TODAY</span>` : "";
        const haHtml  = `<span class="ha-badge ${ha ? "home" : ""}">${ha ? "H" : "A"}</span>`;
        const oppHtml = `<span class="opp-cell">${logo(g.oppTeamId)}${g.opponent || g.oppAbbr || "—"}</span>`;
        const chev    = `<span class="sch-chev">▶</span>`;
        let mainCells;
        if (isPlayed) {
          const res = g.result || "";
          mainCells = `<td>${fmtDate(g.date)}${todayBadge}</td><td>${haHtml}</td><td>${oppHtml}${chev}</td><td class="c"><span class="rec-cell">${g.metsRecord||"—"}</span></td><td class="c"><span class="res-badge ${res}">${res||"—"}</span></td>`;
        } else {
          mainCells = `<td>${fmtDate(g.date)}${todayBadge}</td><td>${haHtml}</td><td>${oppHtml}${chev}</td><td class="c"><span class="rec-cell">${g.oppRecord||"—"}</span></td>`;
        }
        const drawer = detailHtml(g, isPlayed, colspan).replace(/ROWID/g, id);
        return `<tr class="game-row${serCls}${todayCls}" data-id="${id}" onclick="toggleDetail('${id}')">${mainCells}</tr>${drawer}`;
      }).join("");
      return `<table class="sch-table"><thead><tr>${hdr}</tr></thead><tbody>${tbody || `<tr><td colspan="${colspan}" class="sch-loading">No games found</td></tr>`}</tbody></table>`;
    }

    function sosStat(val, lbl, delta) {
      const d = delta ? `<span class="sos-delta ${delta.cls}">${delta.arrow}${delta.val}</span>` : "";
      return `<div class="sos-stat"><div class="sos-stat-val">${val}${d}</div><div class="sos-stat-lbl">${lbl}</div></div>`;
    }

    function delta(a, b, higherIsHarder) {
      if (a == null || b == null) return null;
      const diff = b - a;
      if (Math.abs(diff) < 0.005) return null;
      const harder = higherIsHarder ? diff > 0 : diff < 0;
      return { cls: harder ? "harder" : "easier", arrow: diff > 0 ? "▲" : "▼", val: Math.abs(diff).toFixed(2) };
    }

    const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });

    try {
      const [data, powerRankingsData] = await Promise.all([
        fetch("/data/game-log.json").then(r => { if (!r.ok) throw new Error("Load failed"); return r.json(); }),
        fetch("/data/power-rankings.json").then(r => r.ok ? r.json() : null).catch(() => null)
      ]);
      const summary      = data.summary || {};
      const playedRows   = (data.games || []).map(g => ({ ...g, _today: g.date === today }));
      const upcomingRows = (data.upcomingGames || []).filter(g => g.date >= today).map(g => ({ ...g, _today: g.date === today }));
      const games        = [...playedRows].reverse();
      const upcoming     = upcomingRows;
      const sos          = buildSectionSummary(playedRows);
      const sosU         = buildSectionSummary(upcomingRows);
      const powerRankMap = new Map(((powerRankingsData && powerRankingsData.teams) || [])
        .filter(team => Number.isFinite(Number(team.teamId)) && Number.isFinite(Number(team.rank)))
        .map(team => [String(team.teamId), Number(team.rank)]));
      const averagePowerRank = rows => average(rows, g => {
        const rank = powerRankMap.get(String(g.oppTeamId));
        return rank == null ? null : rank;
      });
      const buildUpcomingSplit = homeAway => {
        const rows = upcomingRows.filter(g => g.homeAway === homeAway);
        return {
          count: rows.length,
          oppWinPct: average(rows, g => parseNumeric(g.oppWinPct))
        };
      };
      const upcomingHome = buildUpcomingSplit("home");
      const upcomingAway = buildUpcomingSplit("away");
      const fmtCount = value => Number.isFinite(Number(value)) ? String(value) : "—";
      const fmtRankAvg = value => value == null ? "—" : value.toFixed(1);

      /* Hero */
      document.getElementById("sch-hero").style.display = "";
      document.getElementById("hero-record").textContent = summary.record || "—";
      const gen = data.generatedAt ? new Date(data.generatedAt).toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
      document.getElementById("hero-meta").textContent = gen ? `Updated ${gen} ET` : "";

      const rPlayed   = summary.sosPlayedRank;
      const rUpcoming = summary.sosUpcomingRank;

      /* Played rank block */
      document.getElementById("sos-played-rank").innerHTML =
        `<div class="sos-rank-badge ${rankClass(rPlayed)}">${suffix(rPlayed)}</div>
         <div class="sos-rank-label">of 30<br>${rankLabel(rPlayed)}</div>`;

      /* Upcoming rank block */
      document.getElementById("sos-upcoming-rank").innerHTML =
        `<div class="sos-rank-badge ${rankClass(rUpcoming)}">${suffix(rUpcoming)}</div>
         <div class="sos-rank-label">of 30<br>${rankLabel(rUpcoming)}</div>`;

      /* Played stats */
      const eraP = sos.avgOppEra;
      const eraU = sosU.avgOppEra;
      const avgP = sos.avgOppAvg;
      const avgU = sosU.avgOppAvg;
      const powerRankPlayed = averagePowerRank(playedRows);
      const powerRankUpcoming = averagePowerRank(upcomingRows);

      document.getElementById("sos-played-stats").innerHTML =
        sosStat(fmtRecord(sos.combinedRecord), "Collective Record") +
        sosStat(summary.homeRecord || "—", "Mets Home Record") +
        sosStat(summary.roadRecord || "—", "Mets Away Record") +
        sosStat(fmtWpct(sos.avgOppWinPct), "Opponent Win %") +
        sosStat(fmtEra(eraP),              "Avg Opp ERA") +
        sosStat(fmtAvg(avgP),              "Avg Opp AVG") +
        sosStat(fmtRankAvg(powerRankPlayed), "Average Power Ranking");

      document.getElementById("sos-upcoming-stats").innerHTML =
        sosStat(fmtRecord(sosU.combinedRecord), "Collective Record") +
        sosStat(fmtCount(upcomingHome.count), "Remaining Home Games") +
        sosStat(fmtCount(upcomingAway.count), "Remaining Away Games") +
        sosStat(fmtWpct(sosU.avgOppWinPct), "Opponent Win %",  delta(sos.avgOppWinPct, sosU.avgOppWinPct, true)) +
        sosStat(fmtWpct(upcomingHome.oppWinPct), "Home Opponent Win %") +
        sosStat(fmtWpct(upcomingAway.oppWinPct), "Away Opponent Win %") +
        sosStat(fmtEra(eraU),               "Avg Opp ERA",  delta(eraP, eraU, false)) +
        sosStat(fmtAvg(avgU),               "Avg Opp AVG", delta(avgP, avgU, true)) +
        sosStat(fmtRankAvg(powerRankUpcoming), "Average Power Ranking");

      /* Tables */
      document.getElementById("played-count").textContent   = games.length;
      document.getElementById("upcoming-count").textContent = upcoming.length;
      document.getElementById("played-wrap").innerHTML   = buildTable(games,    true);
      document.getElementById("upcoming-wrap").innerHTML = buildTable(upcoming, false);

      /* On mobile default to upcoming tab if today's game is upcoming */
      if (window.innerWidth <= 650 && upcoming.length > 0) switchTab("upcoming");

    } catch (err) {
      ["played-wrap","upcoming-wrap"].forEach(id =>
        document.getElementById(id).innerHTML = `<div class="sch-error">Failed to load: ${err.message}</div>`
      );
    }
  })();
  </script>
</body>
</html>
